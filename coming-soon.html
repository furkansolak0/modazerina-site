<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0a;
  color: #fff;
  font-family: 'Josefin Sans', sans-serif;
  font-weight: 200;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  letter-spacing: 0.06em;
}

.bg {
  position: fixed; inset: 0;
  background: url('images/H1.jpg') center/cover no-repeat;
  opacity: 0.18;
  filter: grayscale(30%);
}

.content {
  position: relative; z-index: 2;
  text-align: center;
  display: flex; flex-direction: column;
  align-items: center; gap: 0;
}

.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(32px, 6vw, 64px);
  font-weight: 300;
  letter-spacing: 0.52em;
  text-transform: uppercase;
  color: #fff;
  margin-bottom: 40px;
  animation: fadeUp 1.2s ease 0.2s both;
}

.divider {
  width: 48px; height: 1px;
  background: rgba(255,255,255,0.3);
  margin-bottom: 40px;
  animation: fadeUp 1.2s ease 0.5s both;
}

.tagline {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(16px, 2.5vw, 22px);
  font-weight: 300;
  color: rgba(255,255,255,0.65);
  letter-spacing: 0.08em;
  margin-bottom: 64px;
  animation: fadeUp 1.2s ease 0.7s both;
}

.label {
  font-size: 9px;
  letter-spacing: 0.55em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 32px;
  animation: fadeUp 1.2s ease 0.9s both;
}

.wa-btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  color: #000;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  text-decoration: none;
  padding: 16px 40px;
  transition: background 0.3s, color 0.3s;
  animation: fadeUp 1.2s ease 1.1s both;
}

.wa-btn:hover {
  background: #25D366;
  color: #fff;
}

.wa-btn svg { flex-shrink: 0; }

.bottom {
  position: fixed;
  bottom: 32px; left: 0; right: 0;
  text-align: center;
  font-size: 9px;
  letter-spacing: 0.32em;
  color: rgba(255,255,255,0.18);
  text-transform: uppercase;
  animation: fadeUp 1.2s ease 1.4s both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: none; }
}
</style>
</head>
